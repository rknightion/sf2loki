name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '16 2 * * 6'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@32b5e93dcbb5419fd955f9eb913720cfbc1c13f8 # v1.25.0
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'