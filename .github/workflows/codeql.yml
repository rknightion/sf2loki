name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '16 2 * * 6'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@47976d7e85fddb1c3c329cc870612b59ac433849 # v1.32.8
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30