name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: lint · fmt · type · test · generated drift
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Sync (locked)
        run: just setup

      - name: Ruff lint
        run: just lint

      - name: Ruff format check
        run: just fmt-check

      - name: Mypy (strict)
        run: just typecheck

      - name: Tests
        run: just test

      - name: Generated artifact drift
        run: just gen-check

  docker-build-test:
    name: build image (amd64 smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and load image (amd64 only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sf2loki:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: just smoke sf2loki:test

  package:
    name: build & check dist
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Check dist contents (stubs present; tests/deploy/docs/scratch absent)
        run: just dist-check

  # Lint + render + schema-validate via the shared reusable. kubeconform is now
  # verified against the release's own CHECKSUMS file: the hand-written sha256
  # this job used to carry was correct for its first 42 hex characters and
  # confabulated after, and failed every run for six days before anyone traced a
  # red release train back to it.
  #
  # NOTE: Chart.yaml claims kubeVersion ">=1.21.0-0" but this validates only
  # against 1.29.0, as the hand-rolled job did. Validating at the claimed floor
  # is the correct thing to do and is deliberately NOT changed here, so this port
  # is behaviour-preserving; closing that gap is its own change.
  helm-chart:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@27b0bd31dbe7bf238b89773d00d60ed5dfe187bb # v1.20.0
    with:
      # This chart renders CRD kinds (ExternalSecret + SecretStore) that kubeconform has no
      # built-in schema for. Give it the schema rather than reaching for
      # -ignore-missing-schemas: that flag skips EVERY unschema'd kind
      # silently, so the check passes while validating nothing. sf2loki
      # carried it for exactly that reason and its ExternalSecret and
      # SecretStore had therefore never once been validated.
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      chart-path: deploy/helm
      release-name: sf2loki
      kubernetes-versions: "1.29.0"
      # Blank first line renders the bare default; then the HA topology and the
      # all-extras permutation.
      permutations: |-

        --set ha.enabled=true --set replicaCount=2 --set networkPolicy.enabled=true
        --set externalSecrets.enabled=true --set externalSecrets.aws.region=eu-west-1 --set serviceAccount.esoName=sf2loki-eso --set secrets.create=true

  # Chart-specific, so it stays here rather than moving into the shared reusable:
  # the single-instance guard MUST fail the render for replicaCount>1 without
  # ha.enabled. A reusable has no business encoding one chart's semantics.
  helm-render-guard:
    name: helm render guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Assert single-instance render guard fires
        run: just helm-render-guard

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [gate, docker-build-test, package, helm-chart, helm-render-guard]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
